<!doctype html><html><head><meta charset="utf-8"><title>Local model render checks</title><style>body{margin:0;background:#17232b;color:white;font:14px sans-serif}#viewer{position:fixed;inset:0}#tools{position:fixed;z-index:2;left:8px;bottom:8px;background:#10151ee8;padding:8px;border-radius:8px;max-width:600px}input{width:360px}textarea{width:580px;height:100px}button{margin:4px}#status{max-width:580px}</style><script type="importmap">{"imports":{"three":"/static/vendor/three/build/three.module.js","three/addons/":"/static/vendor/three/examples/jsm/"}}</script></head><body><div id="viewer"></div><div id="tools"><input id="filter" placeholder="Folder or model name"><button id="load">Load first match</button><button id="audit">Audit matches privately</button><button id="all">Audit whole library privately</button><button id="stop">Stop</button><button id="face">Face view</button><button id="materials">Material diagnostics</button><div id="status">Ready</div><textarea id="results" readonly aria-label="Audit results"></textarea></div><script type="module">
import ModelViewer from '/static/js/model-viewer.js?v=game-switch115';
const viewer=new ModelViewer('viewer');viewer.desktopMode=true;viewer.setEnvironmentColor('#ffffff',0);viewer.setCharacterGlow(0);viewer.setGlossBoost(0);
let models=(await(await fetch('/api/models')).json()).models.filter(m=>m.path.toLowerCase().endsWith('.pmx'));
let seed=await (await fetch('/static/render-audit-seed.json')).json();
let stop=false,running=false,renderError=null;
window.addEventListener('sakura-model-render-error',e=>renderError=e.detail);
function matches(){const term=document.getElementById('filter').value.toLowerCase();return models.filter(m=>m.path.toLowerCase().includes(term));}
async function load(m,privateView=false){renderError=null;document.getElementById('viewer').style.visibility=privateView||m.path.toLowerCase().includes('spicy models')?'hidden':'visible';const start=performance.now();const result=await viewer.loadModel('/models/'+m.path.split('/').map(encodeURIComponent).join('/'));viewer._renderFrame();viewer._renderFrame();if(renderError)throw Error(renderError);return {path:m.path,ok:!!result,seconds:Math.round((performance.now()-start)/10)/100,notice:result?.notice||null};}
document.getElementById('load').onclick=async()=>{if(running)return;const m=matches()[0];if(!m){status.textContent='No matching model';return;}try{document.getElementById('status').textContent='Loading '+m.path;const r=await load(m);document.getElementById('status').textContent=JSON.stringify(r);}catch(e){document.getElementById('status').textContent=String(e)}};
async function audit(list){if(running)return;running=true;stop=false;const report=[...seed];for(const m of list){if(stop)break;document.getElementById('status').textContent=`Checking ${report.length+1}/${models.length}`;try{report.push(await load(m,true));}catch(e){report.push({path:m.path,error:String(e)});}viewer.loadGeneration++;viewer._disposeObject(viewer.model);viewer.model=null;viewer.vrm=null;document.getElementById('results').value=JSON.stringify(report);await new Promise(r=>setTimeout(r,10));}running=false;document.getElementById('status').textContent=`Finished ${report.length}/${models.length}; failures: ${report.filter(x=>x.error).length}`;}
document.getElementById('audit').onclick=()=>audit(matches());document.getElementById('all').onclick=()=>audit(models.filter(m=>!seed.some(r=>r.path===m.path&&r.ok)));document.getElementById('stop').onclick=()=>stop=true;document.getElementById('materials').onclick=()=>{const materials=[];viewer.model?.traverse(child=>{for(const m of (Array.isArray(child.material)?child.material:[child.material])){if(m)materials.push({name:m.name,diffuse:m.diffuse?.toArray(),emissive:m.emissive?.toArray(),map:m.map?.image?.src,matcap:m.matcap?.image?.src,defines:m.defines,gradient:!!m.gradientMap});}});document.getElementById('results').value=JSON.stringify(materials);};document.getElementById('face').onclick=()=>{if(viewer.model){viewer.desktopMode=false;viewer._autoFrame(viewer.model);}};
</script></body></html>
